name: Build StopDial

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  source-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified StopDial v2.2 source update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess

          # The workflow-fix commit sits on top of the source staging commit.
          baseline = subprocess.check_output(["git", "rev-parse", "HEAD~2"], text=True).strip()
          assert baseline == "09a0c99408ffeeda39b9654d505cebf4847fbea8", f"Unexpected repository version {baseline}"
          folder = Path(".stopdial-update")
          parts = sorted(folder.glob("part*.txt"))
          assert len(parts) == 3, f"Expected 3 parts, got {len(parts)}"
          patch = lzma.decompress(base64.b64decode(
              "".join(p.read_text() for p in parts), validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == "839e25171c0a66967daf0391cf32061aed90f68264f32724b54ce6ede7626419", f"Source digest mismatch {digest}"
          subprocess.run(["git", "apply", "--unidiff-zero", "--check"],
                         input=patch, check=True)
          subprocess.run(["git", "apply", "--unidiff-zero"],
                         input=patch, check=True)
          for part in parts: part.unlink()
          folder.rmdir()
          # Keep the workflow file unchanged in this restricted CI commit.
          # Its read-only form will be restored via the GitHub integration.
          PY
          git -c user.name="stopdial-ci" -c user.email="stopdial-ci@users.noreply.github.com" add -A
          git diff --cached --check
          git -c user.name="stopdial-ci" -c user.email="stopdial-ci@users.noreply.github.com" commit -m "StopDial v2.2: tighter UI controls and smoother, lighter DSP"
          git push origin HEAD:main

  dsp-regression:
    needs: source-import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure sanitizer-enabled native DSP tests
        run: cmake -S . -B build-dsp -DSTOPDIAL_MATH_ONLY=ON -DSTOPDIAL_ENABLE_SANITIZERS=ON
      - name: Compile tests
        run: cmake --build build-dsp --parallel 2
      - name: Run native tests
        run: ctest --test-dir build-dsp --output-on-failure

  windows:
    needs: source-import
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build StopDial
        run: cmake --build build --config Release --parallel 2
      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 and Standalone
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter "StopDial.vst3" | Select-Object -First 1
          if (-not $vst) { throw "StopDial.vst3 bundle not found" }
          $standalone = Get-ChildItem build -Recurse -File -Filter "StopDial.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item -Recurse $vst.FullName package/
          if (-not $standalone) { throw "StopDial standalone EXE not found" }
          Copy-Item $standalone.FullName package/
          Compress-Archive package/* StopDial-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StopDial-Windows
          path: StopDial-Windows.zip
          if-no-files-found: error

  macos:
    needs: source-import
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure
        run: cmake -S . -B build -G Xcode
      - name: Build StopDial
        run: cmake --build build --config Release --parallel 3
      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 and Standalone
        run: |
          mkdir -p package
          find build -name StopDial.vst3 -type d -exec cp -R '{}' package/ \;
          find build -name StopDial.app -type d -exec cp -R '{}' package/ \;
          test -d package/StopDial.vst3
          test -d package/StopDial.app
          ditto -c -k --sequesterRsrc package StopDial-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StopDial-macOS
          path: StopDial-macOS.zip
          if-no-files-found: error
