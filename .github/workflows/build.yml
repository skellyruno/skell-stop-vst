name: Build StopDial
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package VST3 and Standalone
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter "StopDial.vst3" | Select-Object -First 1
          if (-not $vst) { throw "StopDial.vst3 bundle not found" }
          $standalone = Get-ChildItem build -Recurse -File -Filter "StopDial.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -Recurse $vst.FullName package/
          if ($standalone) { Copy-Item $standalone.FullName package/ }
          Compress-Archive package/* StopDial-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StopDial-Windows
          path: StopDial-Windows.zip
