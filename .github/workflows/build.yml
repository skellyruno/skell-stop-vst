name: Build StopDial

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  source-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply StopDial v2.3 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess

          folder = Path(".stopdial-update")
          if not folder.exists():
              print("Source patch already imported")
              raise SystemExit(0)
          parts = sorted(folder.glob("part*.txt"))
          assert len(parts) == 3, f"Expected three patch parts, found {len(parts)}"
          patch = lzma.decompress(base64.b64decode(
              "".join(p.read_text() for p in parts), validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          expected = "03a490d603c3443a560f19363184b05619ca3d7319f657e1eba42432ed31ee79"
          assert digest == expected, f"Patch digest mismatch: {digest}"
          assert b".github/workflows/" not in patch, "Patch must not edit workflows"
          subprocess.run(["git", "apply", "--check"], input=patch, check=True)
          subprocess.run(["git", "apply"], input=patch, check=True)
          for part in parts: part.unlink()
          folder.rmdir()
          PY
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name="stopdial-ci" -c user.email="stopdial-ci@users.noreply.github.com" commit -m "StopDial v2.3: host-tested audio and responsive UI controls"
            git push origin HEAD:main
          fi

  dsp-regression:
    needs: source-import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure sanitizer-enabled native DSP tests
        run: cmake -S . -B build-dsp -DSTOPDIAL_MATH_ONLY=ON -DSTOPDIAL_ENABLE_SANITIZERS=ON
      - name: Compile tests
        run: cmake --build build-dsp --parallel 2
      - name: Run native tests
        run: ctest --test-dir build-dsp --output-on-failure

  windows:
    needs: source-import
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build StopDial
        run: cmake --build build --config Release --parallel 2
      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 and Standalone
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter "StopDial.vst3" | Select-Object -First 1
          if (-not $vst) { throw "StopDial.vst3 bundle not found" }
          $standalone = Get-ChildItem build -Recurse -File -Filter "StopDial.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item -Recurse $vst.FullName package/
          if (-not $standalone) { throw "StopDial standalone EXE not found" }
          Copy-Item $standalone.FullName package/
          Compress-Archive package/* StopDial-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: StopDial-Windows
          path: StopDial-Windows.zip
          if-no-files-found: error

  macos:
    needs: source-import
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure
        run: cmake -S . -B build -G Xcode
      - name: Build StopDial
        run: cmake --build build --config Release --parallel 3
      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 and Standalone
        run: |
          mkdir -p package
          find build -name StopDial.vst3 -type d -exec cp -R '{}' package/ \;
          find build -name StopDial.app -type d -exec cp -R '{}' package/ \;
          test -d package/StopDial.vst3
          test -d package/StopDial.app
          ditto -c -k --sequesterRsrc package StopDial-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: StopDial-macOS
          path: StopDial-macOS.zip
          if-no-files-found: error
