name: Build StopDial

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  source-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the v2.0 source upgrade when present
        shell: bash
        run: |
          if [ ! -d .stopdial-import ]; then
            echo "Source import already applied"
            exit 0
          fi
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import tarfile

          folder = pathlib.Path(".stopdial-import")
          parts = sorted(folder.glob("part*"))
          assert len(parts) == 8, f"Expected 8 import fragments; got {len(parts)}"
          compressed = base64.b64decode("".join(p.read_text() for p in parts), validate=True)
          expected = "3f3f382960dbc669809bb0b74aefac8b4184a17760bd9d685c486a31585afae5"
          actual = hashlib.sha256(compressed).hexdigest()
          assert actual == expected, f"Import bundle hash mismatch: {actual}"
          with tarfile.open(fileobj=io.BytesIO(compressed), mode="r:xz") as tar:
              for info in tar:
                  path = pathlib.PurePosixPath(info.name)
                  if path.is_absolute() or ".." in path.parts or info.issym() or info.islnk():
                      raise ValueError(f"Unsafe archive entry: {info.name}")
              tar.extractall(".")
          for part in parts:
              part.unlink()
          folder.rmdir()
          PY
          # Keep this tested bootstrap workflow: the bundle also has the regular workflow.
          git restore .github/workflows/build.yml
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="stopdial-ci" -c user.email="stopdial-ci@users.noreply.github.com" commit -m "Import StopDial v2.0 complete JUCE source"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  dsp-regression:
    needs: source-import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Configure sanitizer-enabled native DSP tests
        run: cmake -S . -B build-dsp -DSTOPDIAL_MATH_ONLY=ON -DSTOPDIAL_ENABLE_SANITIZERS=ON
      - name: Compile tests
        run: cmake --build build-dsp --parallel 2
      - name: Run native tests
        run: ctest --test-dir build-dsp --output-on-failure

  windows:
    needs: source-import
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build StopDial
        run: cmake --build build --config Release --parallel 2
      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 and Standalone
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter "StopDial.vst3" | Select-Object -First 1
          if (-not $vst) { throw "StopDial.vst3 bundle not found" }
          $standalone = Get-ChildItem build -Recurse -File -Filter "StopDial.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item -Recurse $vst.FullName package/
          if ($standalone) { Copy-Item $standalone.FullName package/ }
          Compress-Archive package/* StopDial-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StopDial-Windows
          path: StopDial-Windows.zip

  macos:
    needs: source-import
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Configure
        run: cmake -S . -B build -G Xcode
      - name: Build StopDial
        run: cmake --build build --config Release --parallel 3
      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 and Standalone
        run: |
          mkdir -p package
          find build -name StopDial.vst3 -type d -exec cp -R '{}' package/ \;
          find build -name StopDial.app -type d -exec cp -R '{}' package/ \;
          test -d package/StopDial.vst3
          ditto -c -k --sequesterRsrc package StopDial-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StopDial-macOS
          path: StopDial-macOS.zip
